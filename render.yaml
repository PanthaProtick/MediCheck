services:
  - type: web
    name: medicine-check
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v2/health
    numInstances: 1
    envVars:
      - key: APP_MODE
        value: hosted
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
